<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法语词根词缀图谱</title>
<style>
  :root{
    --bg:#f5f2ea; --panel:#ffffff; --panel2:#f1ede2; --line:#e3ddcd;
    --text:#332f28; --muted:#8a8474; --accent:#3a6ea5; --root:#c8442f;
    --word:#4a8a4a; --affix:#8257c5; --focus:#7a4fb0;
    /* 代际配色: gen0=点击点, gen1.. 子代 */
    --g0:#c8442f; --g1:#e07b2b; --g2:#caa820; --g3:#4a9a4a;
    --g4:#2f9e8f; --g5:#3a78b8; --g6:#7a5fc0; --anc:#444b86;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);overflow:hidden}
  #app{display:flex;height:100vh}
  /* sidebar */
  #side{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column}
  #side h1{font-size:17px;margin:0;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700}
  #side h1 small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:4px}
  .search{padding:12px 14px;border-bottom:1px solid var(--line)}
  .search input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:14.5px;outline:none}
  .search input:focus{border-color:var(--accent);background:#fff}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;padding:10px;background:none;border:none;color:var(--muted);
    cursor:pointer;font-size:14px;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
  #list{flex:1;overflow-y:auto;padding:4px 0}
  .letter{padding:8px 18px 3px;color:var(--accent);font-size:13px;font-weight:800;
    position:sticky;top:0;background:var(--panel);letter-spacing:1px}
  .item{padding:7px 18px;cursor:pointer;font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
  .item:hover{background:var(--panel2)}
  .item.on{background:#fbeae6;color:var(--root);font-weight:600}
  .item .m{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
  .res{padding:7px 18px;cursor:pointer;font-size:14.5px}
  .res:hover{background:var(--panel2)}
  .res b{color:var(--accent)}
  .res small{color:var(--muted);display:block;font-size:12.5px}
  /* graph */
  #main{flex:1;position:relative}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  #hint{position:absolute;top:16px;left:50%;transform:translateX(-50%);color:var(--muted);
    font-size:14px;pointer-events:none;text-align:center;line-height:1.8;
    background:rgba(255,255,255,.75);padding:8px 16px;border-radius:10px}
  #toolbar{position:absolute;top:14px;left:14px;display:flex;gap:8px}
  #toolbar button{background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:7px 13px;border-radius:9px;cursor:pointer;font-size:13.5px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  #toolbar button:hover{background:var(--panel2)}
  #legend{position:absolute;bottom:14px;left:14px;font-size:12.5px;color:var(--muted);
    background:rgba(255,255,255,.82);padding:9px 12px;border-radius:10px;line-height:2;
    box-shadow:0 1px 6px rgba(0,0,0,.06)}
  #legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
  /* detail — 浮动卡片, 贴近被点节点, 可拖动 */
  #detail{position:absolute;top:14px;left:14px;width:288px;max-height:72%;
    background:rgba(255,252,246,.80);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    border:1px solid rgba(220,210,190,.9);border-radius:14px;padding:0;
    display:none;flex-direction:column;overflow:hidden;
    box-shadow:0 12px 38px rgba(40,30,10,.20),0 2px 8px rgba(0,0,0,.08);
    transform-origin:left top;animation:pop .16s ease-out}
  #detail.show{display:flex}
  #detail.dragging{animation:none;box-shadow:0 18px 48px rgba(40,30,10,.30)}
  @keyframes pop{from{opacity:0;transform:scale(.92) translateY(4px)}to{opacity:1;transform:none}}
  .dhead{cursor:move;user-select:none}
  .dhead::before{content:"⠿";position:absolute;top:14px;right:40px;color:var(--muted);font-size:14px;opacity:.5}
  .dhead{padding:16px 18px;border-bottom:1px solid var(--line)}
  .dhead .w{font-size:23px;font-weight:700}
  .dhead .pos{display:inline-block;font-size:12px;color:#fff;background:var(--accent);
    padding:2px 9px;border-radius:7px;margin-left:9px;vertical-align:middle;font-weight:600}
  .dhead .mean{color:var(--text);margin-top:7px;font-size:15px;line-height:1.55}
  .dbody{padding:14px 18px;overflow-y:auto}
  .dbody h4{margin:12px 0 7px;font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.5px}
  .chip{display:inline-block;margin:3px 5px 3px 0;padding:5px 11px;border-radius:8px;
    background:var(--panel2);font-size:13.5px;cursor:pointer;border:1px solid transparent}
  .chip:hover{border-color:var(--accent);background:#fff}
  .chip .cm{color:var(--muted);font-size:12px;margin-left:5px}
  .crumb{font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.6}
  .crumb b{color:var(--root)}
  #close{position:absolute;top:12px;right:14px;cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
  #close:hover{color:var(--text)}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>法语词根词缀图谱<small>全局展开 · 点击节点聚焦其派生家族与上游词根 · 共 <span id="cnt"></span> 词</small></h1>
    <div class="search"><input id="q" placeholder="搜索单词 / 词根 / 释义…" autocomplete="off"></div>
    <div class="tabs">
      <button data-tab="roots" class="on">词根</button>
      <button data-tab="affix">词缀</button>
    </div>
    <div id="list"></div>
  </div>
  <div id="main">
    <canvas id="cv"></canvas>
    <div id="toolbar">
      <button id="reset">全局视图</button>
      <button id="fit">适应窗口</button>
    </div>
    <div id="hint">正在生成全局图谱…</div>
    <div id="legend">
      <span class="dot" style="background:var(--root)"></span>词根（圆）
      <span class="dot" style="background:var(--affix);border-radius:1px;transform:rotate(45deg)"></span>词缀（菱）
      <span class="dot" style="background:var(--word)"></span>派生词
      <span class="dot" style="background:var(--g0)"></span>选中
      <span class="dot" style="background:var(--anc)"></span>上游父链
      <br><span style="opacity:.8">子代按层级渐变着色 · 滚轮缩放 · 拖动平移 · 点空白返回全局</span>
    </div>
    <div id="detail">
      <span id="close">×</span>
      <div class="dhead"><div class="w" id="dw"></div><div class="mean" id="dm"></div></div>
      <div class="dbody" id="db"></div>
    </div>
  </div>
</div>
<script src="graph-data.js"></script>
<script>
const G = window.GRAPH;
const byId = {}; G.nodes.forEach(n=>byId[n.id]=n);
const childrenOf = {}; const parentOf = {};
G.links.forEach(l=>{ (childrenOf[l.source]=childrenOf[l.source]||[]).push(l.target); parentOf[l.target]=l.source; });
const roots = G.nodes.filter(n=>n.type==='root').sort((a,b)=>a.label.localeCompare(b.label));
const wordsByRoot = {};
G.nodes.forEach(n=>{ if(n.type!=='affix'){ (wordsByRoot[n.rootId]=wordsByRoot[n.rootId]||[]).push(n);} });
document.getElementById('cnt').textContent = G.nodes.filter(n=>n.type==='word').length;
function depth(n){let d=0,c=n.id;while(parentOf[c]){c=parentOf[c];d++;}return d;}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// ---------- sidebar ----------
const listEl = document.getElementById('list');
let curTab='roots';
function renderRoots(){
  let html=''; let cur='';
  roots.forEach(r=>{
    if(r.letter!==cur){cur=r.letter; html+=`<div class="letter">${cur}</div>`;}
    html+=`<div class="item" data-id="${r.id}"><span>${r.label}</span><span class="m">${esc(r.meaning)}</span></div>`;
  });
  listEl.innerHTML=html;
}
function renderAffix(){
  const af=G.nodes.filter(n=>n.type==='affix'); const groups={};
  af.forEach(a=>{const k=(a.affixType==='prefix'?'前缀 · ':'后缀 · ')+(a.group||'其他');(groups[k]=groups[k]||[]).push(a);});
  let html='';
  Object.keys(groups).forEach(k=>{ html+=`<div class="letter">${k}</div>`;
    groups[k].forEach(a=>{html+=`<div class="item" data-id="${a.id}"><span>${a.label}</span><span class="m">${esc(a.meaning)}</span></div>`;});});
  listEl.innerHTML=html;
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); curTab=b.dataset.tab;
  qEl.value=''; (curTab==='roots'?renderRoots:renderAffix)();
});
listEl.addEventListener('click',e=>{
  const it=e.target.closest('.item'); if(it&&it.dataset.id){selectNode(it.dataset.id);return;}
  const r=e.target.closest('.res'); if(r&&r.dataset.id){const n=byId[r.dataset.id]; n.type==='affix'?showAffix(n):selectNode(n.id);}
});
renderRoots();
const qEl=document.getElementById('q');
qEl.addEventListener('input',()=>{
  const q=qEl.value.trim().toLowerCase();
  if(!q){ (curTab==='roots'?renderRoots:renderAffix)(); return;}
  const hits=G.nodes.filter(n=> n.label.toLowerCase().includes(q) || (n.meaning||'').toLowerCase().includes(q)).slice(0,200);
  listEl.innerHTML = hits.map(n=>`<div class="res" data-id="${n.id}"><b>${esc(n.label)}</b> <small>${esc(n.meaning)} ${n.type==='root'?'· 词根':n.type==='affix'?'· 词缀':'· ← '+esc((byId[n.rootId]||{}).label||'')}</small></div>`).join('') || '<div class="res">无结果</div>';
});

// ---------- canvas / camera ----------
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W,H,DPR=window.devicePixelRatio||1;
function resize(){ W=cv.clientWidth;H=cv.clientHeight; cv.width=W*DPR;cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); draw(); }
window.addEventListener('resize',resize);
let view={k:1,x:0,y:0};                 // screen = world*k + (x,y)
function sx(wx){return wx*view.k+view.x;} function sy(wy){return wy*view.k+view.y;}
function wx(s){return (s-view.x)/view.k;} function wy(s){return (s-view.y)/view.k;}

const GEN=['--g0','--g1','--g2','--g3','--g4','--g5','--g6'];
function genColor(g){return css(GEN[Math.min(g,GEN.length-1)]);}
const cssCache={}; function css(v){if(!cssCache[v])cssCache[v]=getComputedStyle(document.documentElement).getPropertyValue(v).trim();return cssCache[v];}
function computeHL(id){
  const desc={[id]:0}; let fr=[id];
  while(fr.length){const nf=[];fr.forEach(p=>{(childrenOf[p]||[]).forEach(c=>{if(desc[c]==null){desc[c]=desc[p]+1;nf.push(c);}});});fr=nf;}
  const anc={}; let c=parentOf[id],g=1; while(c){anc[c]=g++;c=parentOf[c];}
  return {desc,anc};
}

// ---------- live force simulation ----------
let mode='overview';      // overview | focus | affix
let nodes=[], links=[];   // sim 节点 {ref,x,y,vx,vy,r,fixed} / {s,t}
let nodeOf={}, adj={};    // ref.id -> sim node ; ref.id -> [邻居ref.id]
let selId=null, HL=null, hoverId=null, hoverSet=new Set();
let cfg={charge:5000,gravity:0.02,linkLen:75,linkStr:0.06,damp:0.82};
let alpha=0, raf=null;

function setSim(simNodes, simLinks, conf){
  nodes=simNodes; links=simLinks; cfg=conf; nodeOf={}; adj={};
  nodes.forEach(n=>nodeOf[n.ref.id]=n);
  nodes.forEach(n=>adj[n.ref.id]=[]);
  links.forEach(l=>{ adj[l.s.ref.id].push(l.t.ref.id); adj[l.t.ref.id].push(l.s.ref.id); });
}
function step(a){
  const N=nodes, n=N.length;
  for(let i=0;i<n;i++){const A=N[i];
    for(let j=i+1;j<n;j++){const B=N[j];
      let dx=A.x-B.x,dy=A.y-B.y,d2=dx*dx+dy*dy; if(d2<1)d2=1;
      const f=cfg.charge/d2, d=Math.sqrt(d2); dx/=d;dy/=d;
      A.vx+=dx*f;A.vy+=dy*f;B.vx-=dx*f;B.vy-=dy*f;
    }}
  links.forEach(l=>{const A=l.s,B=l.t;let dx=B.x-A.x,dy=B.y-A.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-cfg.linkLen)*cfg.linkStr; dx/=d;dy/=d; A.vx+=dx*f;A.vy+=dy*f;B.vx-=dx*f;B.vy-=dy*f;});
  N.forEach(o=>{ o.vx+=-o.x*cfg.gravity; o.vy+=-o.y*cfg.gravity;
    o.vx*=cfg.damp; o.vy*=cfg.damp;
    if(o!==dragNode){ o.x+=o.vx*a; o.y+=o.vy*a; } });
}
function loop(){ alpha*=0.99; step(alpha); draw();
  if(alpha<0.008 && !dragNode){ raf=null; return; }
  raf=requestAnimationFrame(loop);
}
function reheat(v){ alpha=Math.max(alpha,v); if(!raf) raf=requestAnimationFrame(loop); }
function warmup(s){ for(let i=0;i<s;i++) step(0.55); }

// ---------- build views ----------
function radiusFor(ref){
  if(ref.type==='root') return 13;
  if(ref.type==='affix') return 11;
  return Math.max(6,12-depth(ref)*1.4);
}
function mkNode(ref,R){ const ang=Math.random()*6.283, rad=Math.random()*R;
  return {ref, x:Math.cos(ang)*rad, y:Math.sin(ang)*rad, vx:0, vy:0, r:radiusFor(ref)}; }

function buildOverview(){
  mode='overview'; selId=null; HL=null;
  const refs=G.nodes.filter(n=>n.type==='root'||n.type==='affix');
  const R=Math.sqrt(refs.length)*42;
  setSim(refs.map(r=>mkNode(r,R)), [], {charge:5200,gravity:0.018,linkLen:0,linkStr:0,damp:0.80});
  document.querySelectorAll('.item').forEach(i=>i.classList.remove('on'));
  document.getElementById('detail').classList.remove('show');
  warmup(140); fitSim(1.2); reheat(0.7);
}
function focusRoot(rootId, sel){
  mode='focus'; selId=sel||rootId; HL=computeHL(selId);
  const ws=wordsByRoot[rootId]||[byId[rootId]];
  const R=Math.sqrt(ws.length)*30+30;
  const sn=ws.map(r=>mkNode(r,R)); const idx={}; sn.forEach(o=>idx[o.ref.id]=o);
  const sl=[]; ws.forEach(w=>{const p=parentOf[w.id]; if(p&&idx[p])sl.push({s:idx[w.id],t:idx[p]});});
  const root=idx[rootId]; if(root){root.x=0;root.y=0;}
  setSim(sn, sl, {charge:2400,gravity:0.05,linkLen:78,linkStr:0.07,damp:0.83});
  markSidebar(rootId, sel);
  document.getElementById('hint').style.display='none';
  warmup(110); fitToHL(1.7); reheat(0.85); showDetail(selId);
}
function affixMatches(a,limit){
  // 前缀匹配词首, 后缀匹配词尾; 词缀可有多个变体(用 / 分隔)
  const vars=a.label.toLowerCase().split('/').map(s=>s.trim()).filter(s=>/^[a-zàâéèêîïôûùç]+$/.test(s));
  if(!vars.length) return [];
  const pre=a.affixType==='prefix';
  const out=[];
  for(const x of G.nodes){ if(x.type==='affix')continue;
    const w=x.label.toLowerCase();
    if(vars.some(v=> pre ? w.startsWith(v) : w.endsWith(v))){ out.push(x); if(out.length>=(limit||70))break; }
  }
  return out;
}
function focusAffix(affixId){
  const a=byId[affixId]; mode='affix'; selId=affixId; HL=null;
  const matched=affixMatches(a,70);
  const refs=[a,...matched]; const R=Math.sqrt(refs.length)*30+30;
  const sn=refs.map(r=>mkNode(r,R)); const idx={}; sn.forEach(o=>idx[o.ref.id]=o);
  idx[affixId].x=0; idx[affixId].y=0;
  const sl=matched.map(m=>({s:idx[affixId],t:idx[m.id]}));
  setSim(sn, sl, {charge:2200,gravity:0.045,linkLen:80,linkStr:0.05,damp:0.83});
  markSidebar(affixId, affixId);
  document.getElementById('hint').style.display='none';
  warmup(110); fitSim(1.6); reheat(0.85); showAffix(a);
}
function markSidebar(rootId, sel){
  document.querySelectorAll('.item').forEach(i=>i.classList.toggle('on', i.dataset.id===rootId||i.dataset.id===sel));
}

// ---------- selection / navigation ----------
function selectNode(id){
  const n=byId[id]; if(!n) return;
  if(n.type==='affix'){ focusAffix(id); return; }
  if(mode==='focus' && nodeOf[id]){            // 已在同一家族, 只换高亮中心
    selId=id; HL=computeHL(id); markSidebar(n.rootId,id);
    fitToHL(1.7); showDetail(id); reheat(0.25); return;
  }
  focusRoot(n.rootId, id);
}
function clearSel(){ buildOverview(); }

// ---------- camera fit ----------
function bboxSim(arr){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const o of arr){const rr=o.r/Math.max(view.k,.001);if(o.x-o.r<a)a=o.x-o.r;if(o.y-o.r<b)b=o.y-o.r;if(o.x+o.r>c)c=o.x+o.r;if(o.y+o.r>d)d=o.y+o.r;}return[a,b,c,d];}
function fitArr(arr,maxK){ if(!arr.length)return; const [a,b,c,d]=bboxSim(arr);
  const bw=(c-a)||1,bh=(d-b)||1,pad=70;
  let k=Math.min((W-pad*2)/bw,(H-pad*2)/bh); k=Math.min(maxK||2,Math.max(0.04,k));
  view.k=k; view.x=W/2-((a+c)/2)*k; view.y=H/2-((b+d)/2)*k; }
function fitSim(maxK){ fitArr(nodes,maxK); draw(); }
function fitToHL(maxK){ const arr=nodes.filter(o=> o.ref.id===selId || (HL&&(HL.desc[o.ref.id]!=null||HL.anc[o.ref.id]!=null))); fitArr(arr.length?arr:nodes,maxK); draw(); }

// ---------- draw ----------
function nodeStyle(ref){
  const isRoot=ref.type==='root', isAffix=ref.type==='affix';
  if(mode==='overview') return {fill:isAffix?css('--affix'):css('--root'),alpha:1,strong:false,lp:0};
  if(mode==='affix'){ if(ref.id===selId) return {fill:css('--affix'),alpha:1,strong:true,lp:2};
    return {fill:css('--word'),alpha:1,strong:false,lp:1}; }
  if(ref.id===selId) return {fill:css('--g0'),alpha:1,strong:true,lp:2};
  if(HL.desc[ref.id]!=null) return {fill:genColor(HL.desc[ref.id]),alpha:1,strong:false,lp:1};
  if(HL.anc[ref.id]!=null) return {fill:css('--anc'),alpha:1,strong:isRoot,lp:2};
  return {fill:isRoot?css('--root'):css('--word'),alpha:0.13,strong:false,lp:-1};
}
function wantLabel(ref,st){
  if(st.lp<0) return false;
  if(st.lp>=2) return true;
  if(hoverId===ref.id||hoverSet.has(ref.id)) return true;
  if(mode!=='overview') return st.lp>=1;
  return view.k>0.62;
}
function positionCard(){
  if(!detail.classList.contains('show')||cardMoved) return;
  const o=nodeOf[selId]; if(!o){ return; }
  const px=sx(o.x), py=sy(o.y), nr=o.r*Math.min(1.6,Math.max(.4,view.k));
  const cw=detail.offsetWidth||288, ch=detail.offsetHeight||260, m=10;
  let left=px+nr+14;                       // 默认浮在节点右侧
  if(left+cw>W-m) left=px-nr-14-cw;        // 右侧放不下则翻到左侧
  left=Math.max(m,Math.min(left,W-cw-m));
  let top=py-28; top=Math.max(m,Math.min(top,H-ch-m));
  detail.style.left=left+'px'; detail.style.top=top+'px';
}
function draw(){
  if(!W) return;
  positionCard();
  ctx.clearRect(0,0,W,H);
  // links
  for(const l of links){
    const A=l.s,B=l.t, ax=sx(A.x),ay=sy(A.y),bx=sx(B.x),by=sy(B.y);
    let col='rgba(150,142,124,0.30)', lw=1.2;
    if(mode==='focus'){
      const tg=HL.desc[B.ref.id], sg=HL.desc[A.ref.id];
      if(tg!=null&&sg!=null){col=genColor(Math.max(tg,sg));lw=2;}
      else if(HL.anc[A.ref.id]!=null||HL.anc[B.ref.id]!=null){col=css('--anc');lw=2;}
      else col='rgba(150,142,124,0.10)';
    } else if(mode==='affix'){ col='rgba(192,138,43,0.35)'; lw=1.4; }
    ctx.strokeStyle=col;ctx.lineWidth=lw;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
  }
  // nodes
  for(const o of nodes){
    const ref=o.ref, px=sx(o.x),py=sy(o.y),r=o.r*Math.min(1.6,Math.max(.4,view.k));
    if(px<-40||px>W+40||py<-40||py>H+40) continue;
    const st=nodeStyle(ref), rr=Math.max(2,r);
    ctx.globalAlpha=st.alpha;
    ctx.beginPath();
    if(ref.type==='affix'){ const d=rr*1.25;  // 菱形区分词缀
      ctx.moveTo(px,py-d);ctx.lineTo(px+d,py);ctx.lineTo(px,py+d);ctx.lineTo(px-d,py);ctx.closePath();
    } else ctx.arc(px,py,rr,0,7);
    ctx.fillStyle=st.fill;ctx.fill();
    if(st.strong){ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();ctx.lineWidth=1.6;ctx.strokeStyle=st.fill;ctx.stroke();}
    if(wantLabel(ref,st) && r>3){
      ctx.globalAlpha=Math.max(st.alpha,0.92);
      ctx.fillStyle=css('--text');
      const big=ref.type==='root'||ref.type==='affix'||st.strong;
      ctx.font=(big?'700 ':'500 ')+Math.max(11,(big?14.5:13)*Math.min(1.35,Math.max(.7,view.k)))+'px "Segoe UI",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillText(ref.label,px,py+r+3);
    }
    ctx.globalAlpha=1;
  }
}
document.getElementById('fit').onclick=()=>{ mode==='focus'?fitToHL(1.7):fitSim(mode==='overview'?1.2:1.6); };
document.getElementById('reset').onclick=clearSel;

// ---------- detail ----------
const detail=document.getElementById('detail');
let cardMoved=false, cardDrag=null;
document.getElementById('close').onclick=()=>detail.classList.remove('show');
function popCard(){ cardMoved=false; detail.style.animation='none'; void detail.offsetWidth; detail.style.animation=''; detail.classList.add('show'); detail.scrollTop=0; }
// 拖动卡片(标题栏为手柄) — 拖过后不再自动跟随节点
detail.querySelector('.dhead').addEventListener('mousedown',e=>{
  if(e.target.id==='close')return;
  cardDrag={mx:e.clientX,my:e.clientY,l:detail.offsetLeft,t:detail.offsetTop};
  detail.classList.add('dragging'); e.preventDefault();
});
window.addEventListener('mousemove',e=>{
  if(!cardDrag)return; cardMoved=true;
  let l=cardDrag.l+(e.clientX-cardDrag.mx), t=cardDrag.t+(e.clientY-cardDrag.my);
  l=Math.max(4,Math.min(l,W-detail.offsetWidth-4)); t=Math.max(4,Math.min(t,H-detail.offsetHeight-4));
  detail.style.left=l+'px'; detail.style.top=t+'px';
});
window.addEventListener('mouseup',()=>{ if(cardDrag){cardDrag=null;detail.classList.remove('dragging');} });
function showDetail(id){
  const n=byId[id]; if(!n)return;
  popCard();
  document.getElementById('dw').innerHTML=esc(n.label)+(n.pos?`<span class="pos">${esc(n.pos)}</span>`:'');
  document.getElementById('dm').innerHTML=esc(stripPos(n.meaning,n.pos));
  let html='';
  if(n.type==='word'){ const chain=[];let c=n.id;while(parentOf[c]){c=parentOf[c];chain.unshift(byId[c]);}
    html+=`<div class="crumb">`+chain.map(x=>`<b>${esc(x.label)}</b>`).join(' → ')+(chain.length?' → ':'')+esc(n.label)+`</div>`; }
  else html+=`<div class="crumb">词根 · ${n.rootKind==='simple'?'简单词根':'合成词根'} · 家族 ${(wordsByRoot[n.id]||[]).length} 词</div>`;
  const p=parentOf[n.id]; if(p) html+=`<h4>派生自（上游）</h4>`+chip(byId[p]);
  const kids=(childrenOf[n.id]||[]).map(i=>byId[i]);
  if(kids.length) html+=`<h4>直接派生词 (${kids.length})</h4>`+kids.map(chip).join('');
  if(n.type==='word'){ const sib=(childrenOf[p]||[]).filter(i=>i!==n.id).map(i=>byId[i]);
    if(sib.length) html+=`<h4>同源兄弟</h4>`+sib.slice(0,14).map(chip).join(''); }
  document.getElementById('db').innerHTML=html;
  requestAnimationFrame(positionCard);
}
function chip(n){if(!n)return'';return `<span class="chip" onclick="selectNode('${n.id}')">${esc(n.label)}<span class="cm">${esc(shortMean(n.meaning))}</span></span>`;}
function shortMean(m){m=stripPos(m,'');return m.length>10?m.slice(0,10)+'…':m;}
function stripPos(m,p){if(p&&m.startsWith(p))m=m.slice(p.length);return m.replace(/^[\s.]+/,'');}
function showAffix(n){
  popCard();
  document.getElementById('dw').innerHTML=esc(n.label)+`<span class="pos">${n.affixType==='prefix'?'前缀':'后缀'}</span>`;
  document.getElementById('dm').innerHTML=esc(n.meaning);
  const ms=affixMatches(n,40);
  document.getElementById('db').innerHTML=`<div class="crumb">${esc(n.group||'')} · ${n.affixType==='prefix'?'匹配词首':'匹配词尾'}</div><h4>含该词缀的单词 (${ms.length}${ms.length>=40?'+':''})</h4>`+
    (ms.map(chip).join('')||'—');
  requestAnimationFrame(positionCard);
}

// ---------- pan / zoom / pick / hover ----------
let dragNode=null,panning=false,last={x:0,y:0},moved=false;
function pick(mx,my){let best=null,bd=1e9;for(const o of nodes){const dx=sx(o.x)-mx,dy=sy(o.y)-my,d=dx*dx+dy*dy;const rr=(o.r*view.k+6)**2;if(d<=rr&&d<bd){bd=d;best=o;}}return best;}
function setHover(o){ const id=o?o.ref.id:null; if(id===hoverId)return; hoverId=id;
  hoverSet=new Set(id?adj[id]:[]); cv.style.cursor=o?'pointer':(panning?'grabbing':'grab');
  if(!raf) draw(); }
cv.addEventListener('mousedown',e=>{moved=false;last={x:e.offsetX,y:e.offsetY};const o=pick(e.offsetX,e.offsetY);if(o){dragNode=o;cv.style.cursor='grabbing';}else panning=true;});
window.addEventListener('mousemove',e=>{
  const rect=cv.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  if(!dragNode&&!panning){ if(mx>=0&&my>=0&&mx<=W&&my<=H) setHover(pick(mx,my)); return; }
  const dx=mx-last.x,dy=my-last.y; if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
  if(dragNode){ dragNode.x+=dx/view.k; dragNode.y+=dy/view.k; reheat(0.4); }
  else { view.x+=dx;view.y+=dy; if(!raf)draw(); }
  last={x:mx,y:my};
});
window.addEventListener('mouseup',()=>{
  if(dragNode&&!moved) selectNode(dragNode.ref.id);
  else if(panning&&!moved && mode!=='overview') clearSel();
  dragNode=null;panning=false;cv.style.cursor='grab';
});
cv.addEventListener('wheel',e=>{e.preventDefault();
  const f=e.deltaY<0?1.15:0.87, mx=e.offsetX,my=e.offsetY, wxp=wx(mx),wyp=wy(my);
  view.k=Math.max(0.04,Math.min(4,view.k*f)); view.x=mx-wxp*view.k; view.y=my-wyp*view.k; if(!raf)draw();
},{passive:false});

// ---------- init ----------
resize();
setTimeout(()=>{ buildOverview();
  document.getElementById('hint').innerHTML='全局视图：所有词根（红）+ 词缀（橙）<br>点击任意节点或搜索单词，展开其派生家族';
  const h=document.getElementById('hint'); setTimeout(()=>{h.style.transition='opacity .6s';h.style.opacity='0';},3200);
},30);
</script>
